<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      -webkit-tap-highlight-color: transparent;
      font-feature-settings: "liga" 0;
    }
    #terminal { width: 100%; height: 100%; }
  </style>
  <!-- Vanilla hterm 1.78 (hterm-umdjs), patched to expose window.hterm / window.lib.
       No iOS/WKWebView hooks — data is driven in from ArkTS via harmony_term.js. -->
  <script src="base64js.min.js"></script>
  <script src="hterm_all.min.js"></script>
  <script src="harmony_term.js"></script>
</head>
<body autocapitalize='none' contenteditable='false' spellcheck='false' autocomplete='off' autocorrect='off'>
  <div id="terminal"></div>
</body>
</html>
