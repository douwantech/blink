name: WatchAssistant
options:
  bundleIdPrefix: com.aitools.talkcode
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "659T9VUN97"
targets:
  WatchAssistant:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 腕上助手
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: 语音下指令给标签
        NSSpeechRecognitionUsageDescription: 把你说的话转成给标签的指令
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aitools.talkcode.watch
